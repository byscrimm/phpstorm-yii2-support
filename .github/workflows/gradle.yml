name: Build and verify Yii2 plugin
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, SDK compatibility, and installable ZIP
        run: ./gradlew --no-daemon check verifyPlugin buildPlugin
      - name: Upload plugin
        uses: actions/upload-artifact@v4
        with:
          name: yii2-support-extended
          path: build/distributions/*.zip
          if-no-files-found: error
      - name: Upload test and verifier reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: build/reports/
          if-no-files-found: ignore
